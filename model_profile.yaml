# ==========================================================================
# v3.0 Model / Task Resource Profile
# Used by the data-center scheduler for resource-aware decisions.
# ==========================================================================
models:

  diagnosis:
    worker:
      cpu: 4
      memory: "8G"
      gpu: 0
      # Medical DoubleTower front-end, MUST run on edge (hospital) pod
    server:
      cpu: 4
      memory: "8G"
      gpu: 1
      # DoubleTower back-end, runs on the data center (cloud node3)
    constraints:
      worker:
        allowed_roles: ["edge"]
      server:
        allowed_roles: ["cloud"]

  compute:
    comp:
      cpu: 2
      memory: "2G"
      gpu: 0
      # Collaborative compute partition (edge pods + data center)
    constraints:
      comp:
        allowed_roles: ["edge", "cloud"]

  sync:
    sync:
      cpu: 1
      memory: "1G"
      gpu: 0
      # Patient-db P2P cloud sync (network heavy)
    constraints:
      sync:
        allowed_roles: ["edge", "cloud"]

  routine:
    job:
      cpu: 1
      memory: "512M"
      gpu: 0
      # Short-lived Kubernetes Job created on the node with free resources
    constraints:
      job:
        allowed_roles: ["edge", "cloud"]

# Priority levels:
#   10 = Emergency (medical urgent)
#    9 = Urgent clinical
#    5 = Routine clinical
#    1 = Test/batch processing
priority_levels:
  emergency: 10
  urgent_clinical: 9
  routine_clinical: 5
  test_batch: 1
