# ==========================================================================
# Model Resource Profile - Used by scheduler for resource-aware dispatch
# ==========================================================================
models:

  alexnet:
    part1:
      cpu: 2
      memory: "4G"
      gpu: 0
      # AlexNet part1 (Conv1-Conv5+avgpool) can run on any node
    part2:
      cpu: 4
      memory: "4G"
      gpu: 0
      # AlexNet part2 (FC1-FC3) prefers cloud but can run anywhere
    constraints:
      part1:
        allowed_roles: ["edge", "cloud", "control-plane"]
      part2:
        allowed_roles: ["edge", "cloud", "control-plane"]

  medical:
    worker:
      cpu: 4
      memory: "8G"
      gpu: 0
      # Medical worker runs ResNet front-end (conv1→maxpool) + clinical/radiomics encoding
      # MUST run on edge node (hospital) - raw patient data stays local
    server:
      cpu: 4
      memory: "8G"
      gpu: 1
      # Medical server runs ResNet back-end (layer1-4) + fusion + classifier
      # MUST run on cloud node (data center) - high computation
    constraints:
      worker:
        allowed_roles: ["edge"]
        # Worker must be on edge - patient data never leaves the hospital
      server:
        allowed_roles: ["cloud"]
        # Server must be on cloud - centralized high-compute inference

  clinic:
    mem:
      cpu: 1
      memory: "512M"
      gpu: 0
      # Clinic memory-monitor task: lightweight, runs on edge nodes
      # (clinics co-locate with hospital pods on node1/node2)
    constraints:
      mem:
        allowed_roles: ["edge"]

# Priority levels:
#   10 = Emergency (medical urgent)
#    9 = Urgent clinical
#    5 = Routine clinical
#    1 = Test/batch processing
priority_levels:
  emergency: 10
  urgent_clinical: 9
  routine_clinical: 5
  test_batch: 1
