# ==========================================================================
# Data Center Services (v3.0) - patient database + compute worker
# Deployed on node3 (cloud / data center). Port 8010.
# ==========================================================================
apiVersion: apps/v1
kind: Deployment

metadata:
  name: dc-services
  labels:
    app: dc-services
    role: datacenter

spec:
  replicas: 1

  selector:
    matchLabels:
      app: dc-services

  template:
    metadata:
      labels:
        app: dc-services
        role: datacenter

    spec:
      nodeSelector:
        kubernetes.io/hostname: node3

      containers:
      - name: dc
        image: k8s-master:5000/k8s-repo/dc:v3.0
        imagePullPolicy: IfNotPresent

        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DB_VERSION
          value: "v3-db-1"
        - name: DB_ITEM_COUNT
          value: "64"
        - name: CHUNK_KB
          value: "4"

        ports:
        - name: http
          containerPort: 8010

        readinessProbe:
          httpGet:
            path: /health
            port: 8010
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 8010
          initialDelaySeconds: 10
          periodSeconds: 20
          failureThreshold: 3

        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "2"
            memory: "1Gi"
---
apiVersion: v1
kind: Service

metadata:
  name: dc-services
  labels:
    app: dc-services

spec:
  selector:
    app: dc-services
  ports:
  - name: http
    protocol: TCP
    port: 8010
    targetPort: 8010
  type: ClusterIP
