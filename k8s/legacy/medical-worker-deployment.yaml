apiVersion: apps/v1
kind: Deployment

metadata:
  name: medical-worker
  labels:
    app: medical-worker
    model: medical
    stage: worker

spec:
  replicas: 2

  selector:
    matchLabels:
      app: medical-worker

  template:
    metadata:
      labels:
        app: medical-worker
        model: medical
        stage: worker

    spec:
      # Deploy on edge nodes (Hospital A: node1, Hospital B: node2)
      nodeSelector:
        role: edge

      # REQUIRED: one worker per hospital (hospital-a => node1, hospital-b => node2).
      # topologyKey=hospital with 2 replicas guarantees the two workers are never
      # scheduled on the same hospital/node (data does not leave its hospital).
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: hospital
            labelSelector:
              matchLabels:
                app: medical-worker

      containers:
      - name: medical-worker
        image: 10.29.182.66:5000/k8s-repo/medical-worker:v1.0
        imagePullPolicy: IfNotPresent

        env:
        - name: MODEL_PATH
          value: "/app/weights/best_model_fold1.pth"

        ports:
        - name: http
          containerPort: 8006

        readinessProbe:
          httpGet:
            path: /health
            port: 8006
          initialDelaySeconds: 120
          periodSeconds: 15
          failureThreshold: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 8006
          initialDelaySeconds: 180
          periodSeconds: 30
          failureThreshold: 5

        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "8Gi"

        volumeMounts:
        - name: model-weights
          mountPath: /app/weights
          readOnly: true

      volumes:
      - name: model-weights
        hostPath:
          path: /data/medical-model/weights
          type: DirectoryOrCreate
