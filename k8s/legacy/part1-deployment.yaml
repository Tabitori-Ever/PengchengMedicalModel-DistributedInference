apiVersion: apps/v1
kind: Deployment

metadata:
  name: part1
  labels:
    app: part1
    model: alexnet
    stage: part1

spec:
  replicas: 4

  selector:
    matchLabels:
      app: part1

  template:
    metadata:
      labels:
        app: part1
        model: alexnet
        stage: part1

    spec:
      # Prefer edge nodes but can run anywhere
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - key: role
                operator: In
                values: ["edge", "cloud"]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: part1

      containers:
      - name: part1
        image: 10.29.182.66:5000/k8s-repo/alexnet-part1:v9
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8001

        readinessProbe:
          httpGet:
            path: /
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 5

        livenessProbe:
          httpGet:
            path: /
            port: 8001
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 5

        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
