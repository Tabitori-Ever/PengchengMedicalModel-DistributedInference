apiVersion: apps/v1
kind: Deployment

metadata:
  name: scheduler
  labels:
    app: scheduler
    component: data-center

spec:
  replicas: 1

  selector:
    matchLabels:
      app: scheduler

  template:
    metadata:
      labels:
        app: scheduler
        component: data-center

    spec:
      # v3.0: the scheduler (data-center scheduling function) lives on the
      # cloud node node3 together with medical-server / dc-services / redis.
      nodeSelector:
        kubernetes.io/hostname: node3

      containers:
      - name: scheduler
        image: 10.29.182.66:5000/k8s-repo/inference-scheduler:v3.1.4
        imagePullPolicy: IfNotPresent

        env:
        # Hospital pods (diagnosis worker front-end + v3 worker)
        - name: HOSPITAL_A_URL
          value: "http://hospital-a-service:8006"
        - name: HOSPITAL_B_URL
          value: "http://hospital-b-service:8006"
        # Clinic pods (initiators + v3 worker)
        - name: CLINIC_1_URL
          value: "http://clinic-1-service:8007"
        - name: CLINIC_2_URL
          value: "http://clinic-2-service:8007"
        # Data center services: medical server + patient-db / compute worker
        - name: MEDICAL_SERVER_URL
          value: "http://medical-server-service:9001"
        - name: DC_SERVICES_URL
          value: "http://dc-services:8010"
        # Redis (same node in v3.0)
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        # Routine Jobs: image that carries /app/run_routine.py
        - name: ROUTINE_IMAGE
          value: "10.29.182.66:5000/k8s-repo/clinic:v3.0"
        # Concurrency
        - name: MAX_CONCURRENT
          value: "4"
        - name: MAX_QUEUE_SIZE
          value: "200"

        ports:
        - name: http
          containerPort: 8000
        - name: metrics
          containerPort: 9000

        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5

        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
