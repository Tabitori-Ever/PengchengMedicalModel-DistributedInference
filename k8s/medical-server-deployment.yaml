apiVersion: apps/v1
kind: Deployment

metadata:
  name: medical-server
  labels:
    app: medical-server
    model: medical
    stage: server

spec:
  # node3 (4C/8Gi) hosts 1 medical-server (per layout change);
  # a 2nd server replica would not fit node3, keep it at 1.
  replicas: 1

  selector:
    matchLabels:
      app: medical-server

  template:
    metadata:
      labels:
        app: medical-server
        model: medical
        stage: server

    spec:
      # Fixed on cloud node (node3)
      nodeSelector:
        role: cloud

      containers:
      - name: medical-server
        image: k8s-master:5000/k8s-repo/medical-server:v1.4
        imagePullPolicy: IfNotPresent

        env:
        - name: MODEL_PATH
          value: "/app/weights/best_model_fold1.pth"

        ports:
        - name: http
          containerPort: 9001

        readinessProbe:
          httpGet:
            path: /health
            port: 9001
          initialDelaySeconds: 120
          periodSeconds: 15
          failureThreshold: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 9001
          initialDelaySeconds: 180
          periodSeconds: 30
          failureThreshold: 5

        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "8Gi"

        volumeMounts:
        - name: model-weights
          mountPath: /app/weights
          readOnly: true

      volumes:
      - name: model-weights
        hostPath:
          path: /data/medical-model/weights
          type: DirectoryOrCreate
