# ==========================================================================
# Clinic-1 Pod (v2.0) - memory-monitor task, co-located with hospital-a
# on node1. Uses the clinic ServiceAccount (defined in clinic-rbac.yaml).
# ==========================================================================
apiVersion: apps/v1
kind: Deployment

metadata:
  name: clinic-1
  labels:
    app: clinic
    clinic: clinic-1
    model: clinic
    stage: mem

spec:
  replicas: 1

  selector:
    matchLabels:
      app: clinic
      clinic: clinic-1

  template:
    metadata:
      labels:
        app: clinic
        clinic: clinic-1
        model: clinic
        stage: mem

    spec:
      serviceAccountName: clinic
      nodeSelector:
        kubernetes.io/hostname: node1

      containers:
      - name: clinic
        image: 10.29.182.66:5000/k8s-repo/clinic:v2.0
        imagePullPolicy: IfNotPresent

        env:
        - name: CLINIC_NAME
          value: "clinic-1"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        ports:
        - name: http
          containerPort: 8007

        readinessProbe:
          httpGet:
            path: /health
            port: 8007
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 8007
          initialDelaySeconds: 10
          periodSeconds: 20
          failureThreshold: 3

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
